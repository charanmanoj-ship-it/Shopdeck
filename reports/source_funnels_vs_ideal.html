const monSel=document.getElementById('mon'), srcSel=document.getElementById('src');
months.forEach(m=>monSel.add(new Option(m,m)));
srcOrder.forEach(s=>{ if(D['April'][s]||D['May'][s]||D['June'][s]) srcSel.add(new Option(s,s)); });
monSel.value=mon; srcSel.value=src;
const hzDiv=document.getElementById('hz');
HZ.forEach((h,i)=>{const b=document.createElement('button');b.textContent=h;b.className=i===hi?'on':'';b.onclick=()=>{hi=i;[...hzDiv.children].forEach((x,j)=>x.className=j===hi?'on':'');render();};hzDiv.appendChild(b);});
monSel.onchange=()=>{mon=monSel.value;render();}; srcSel.onchange=()=>{src=srcSel.value;render();};
function colorFor(actual,ideal){const g=actual-ideal;return g>=0?'var(--good)':(g>=-10?'var(--warn)':'var(--crit)');}
function render(){
  const md=D[mon], node=md[src]||md['All'], h=HZ[hi];
  document.getElementById('ftitle').textContent=`${mon} · ${src} · ${h}  (n=${node.n})`;
  // maturity warning
  const wb=document.getElementById('warn');
  if(mon==='June' && (h==='d30'||h==='d60')){wb.style.display='block';wb.innerHTML=`⚠️ June is not fully mature at ${h} — its youngest tickets are ~21 days old, so these numbers are a <b>floor</b> and will rise. Use d15 for a fair June comparison.`;}
  else wb.style.display='none';
  // KPIs GTG, A2H
  const gtg=node.stages['GTG'][hi], a2h=node.stages['A2H'][hi];
  const gI=IDEAL['GTG'][hi], aI=IDEAL['A2H'][hi];
  document.getElementById('kpis').innerHTML=
   `<div class="kpi"><div class="n">${gtg}%</div><div class="l">GTG @${h}</div><div class="d ${gtg>=gI?'up':'dn'}">${gtg>=gI?'▲':'▼'}${Math.abs(gtg-gI).toFixed(0)} vs ideal</div></div>`+
   `<div class="kpi"><div class="n">${a2h}%</div><div class="l">A2H @${h}</div><div class="d ${a2h>=aI?'up':'dn'}">${a2h>=aI?'▲':'▼'}${Math.abs(a2h-aI).toFixed(0)} vs ideal</div></div>`;
  // funnel bars
  document.getElementById('funnel').innerHTML=ST.map(st=>{
    const v=node.stages[st][hi], id=IDEAL[st][hi], g=v-id;
    return `<div class="row"><div class="cat">${st}</div><div class="track"><div class="bar" style="width:${v}%;background:${colorFor(v,id)}"></div><div class="ideal" style="left:${Math.min(id,100)}%"></div></div><div class="val"><b>${v}%</b> <span class="dl ${g>=0?'up':'dn'}">${g>=0?'+':''}${g.toFixed(0)}</span></div></div>`;
  }).join('');
  // leaderboard: sources ranked by GTG at this month+horizon
  document.getElementById('lbtitle').textContent=`Sources — GTG & A2H @${h} (${mon})`;
  const rows=srcOrder.filter(s=>s!=='All'&&md[s]).map(s=>({s,n:md[s].n,gtg:md[s].stages['GTG'][hi],a2h:md[s].stages['A2H'][hi]})).sort((a,b)=>b.gtg-a.gtg);
  document.getElementById('board').innerHTML=`<div class="lb-row hd"><div>source (n)</div><div class="v">GTG</div><div class="v">A2H</div></div>`+
    rows.map(r=>`<div class="lb-row"><div class="s"><i class="dot" style="background:${colorFor(r.gtg,gI)}"></i>${r.s} <span style="color:var(--ink3);font-size:11px">${r.n}</span></div><div class="v" style="color:${colorFor(r.gtg,gI)}">${r.gtg}%</div><div class="v" style="color:${colorFor(r.a2h,aI)}">${r.a2h}%</div></div>`).join('');
  document.getElementById('note').innerHTML=`Ideal @${h}: GTG ${gI}%, A2H ${aI}%. Bars/dots colored vs the stage's ideal at this horizon (green ≥ ideal, amber within 10pt, red >10pt below). Ideal = the 75%-GoLive target funnel, phased at observed cadence. June d30/d60 immature (floor).`;
}
render();
</script>
