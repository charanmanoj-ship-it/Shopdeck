<title>Onboarding Funnel — Ideal vs Actual</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ground:#FAFAF7;--surface:#fff;--surface2:#f3f3ee;--ink:#1a1f2b;--ink2:#4a5262;--ink3:#818a99;--navy:#1F3864;--track:#e8ebf2;--ideal:#C7962B;--good:#2f6b4f;--crit:#B23A48;--line:#e6e6df}
@media(prefers-color-scheme:dark){:root{--ground:#14181f;--surface:#1b212b;--surface2:#222a36;--ink:#e8eaed;--ink2:#aab2c0;--ink3:#7a8393;--navy:#7ba3e0;--track:#2a3342;--ideal:#E0B65C;--good:#6fca9f;--crit:#e6717f;--line:#2c3542}}
:root[data-theme=light]{--ground:#FAFAF7;--surface:#fff;--surface2:#f3f3ee;--ink:#1a1f2b;--ink2:#4a5262;--ink3:#818a99;--navy:#1F3864;--track:#e8ebf2;--ideal:#C7962B;--good:#2f6b4f;--crit:#B23A48;--line:#e6e6df}
:root[data-theme=dark]{--ground:#14181f;--surface:#1b212b;--surface2:#222a36;--ink:#e8eaed;--ink2:#aab2c0;--ink3:#7a8393;--navy:#7ba3e0;--track:#2a3342;--ideal:#E0B65C;--good:#6fca9f;--crit:#e6717f;--line:#2c3542}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:clamp(24px,4vw,48px) clamp(16px,4vw,36px)}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);font-weight:650;margin:0 0 8px}
h1{font-size:clamp(23px,4vw,33px);letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.sub{color:var(--ink2);font-size:15px;margin:0 0 22px}
.controls{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin-bottom:24px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
label.lb{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px;font-weight:600}
select{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);min-width:150px;cursor:pointer}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.toggle button{font:inherit;font-size:14px;font-weight:600;padding:8px 15px;border:0;background:var(--surface2);color:var(--ink2);cursor:pointer}
.toggle button.on{background:var(--navy);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.kpi .n{font-size:clamp(22px,3.5vw,30px);font-weight:720;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:7px}.kpi .d{font-size:12px;margin-top:4px;font-weight:600}
.up{color:var(--good)}.dn{color:var(--crit)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.legend{display:flex;gap:18px;font-size:12px;color:var(--ink2);margin-bottom:16px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}.sw{width:14px;height:10px;border-radius:2px}
.hd,.row{display:grid;grid-template-columns:130px 1fr 132px;gap:12px;align-items:center}
.hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:8px}.hd .r{text-align:right}
.row{margin-bottom:8px}.row .cat{font-size:13.5px;color:var(--ink2)}
.track{position:relative;background:var(--track);border-radius:5px;height:27px}
.bar{height:100%;background:var(--navy);border-radius:5px;min-width:2px;transition:width .35s ease}
.ideal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ideal)}
.ideal::after{content:'';position:absolute;top:-4px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--ideal)}
.val{text-align:right;font-size:13px}.val b{font-weight:700}.val .id{color:var(--ink3);font-size:11.5px}
.dlt{font-weight:700;font-size:12px}
.note{font-size:12.5px;color:var(--ink3);margin-top:16px;line-height:1.6}
.callout{margin-top:16px;padding:12px 16px;background:var(--surface2);border-left:3px solid var(--navy);border-radius:8px;font-size:13.5px;color:var(--ink2)}
@media(max-width:600px){.kpis{grid-template-columns:1fr}.hd,.row{grid-template-columns:92px 1fr 92px}}
</style>
<div class="wrap">
  <p class="eyebrow">Onboarding · ideal = 7-day target</p>
  <h1>Funnel: actual vs ideal</h1>
  <p class="sub">Each stage's reach within the window vs your 7-day ideal funnel. April/May/June are all fully mature at both horizons — final numbers, not floors.</p>
  <div class="controls">
    <div><label class="lb">Month</label><select id="mon"></select></div>
    <div><label class="lb">Source</label><select id="src"></select></div>
    <div><label class="lb">Window</label><div class="toggle"><button data-h="d7" class="on">0–7 days</button><button data-h="d9">0–9 days</button></div></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="chart">
    <div class="legend">
      <span><i class="sw" style="background:var(--navy)"></i> actual (% of sales reaching stage)</span>
      <span><i class="sw" style="background:var(--ideal);width:10px;height:10px;border-radius:50%"></i> ideal (7-day target)</span>
    </div>
    <div class="hd"><div>Stage</div><div></div><div class="r">actual · ideal · Δ</div></div>
    <div id="funnel"></div>
    <div class="callout" id="cap"></div>
    <div class="note" id="note"></div>
  </div>
</div>
