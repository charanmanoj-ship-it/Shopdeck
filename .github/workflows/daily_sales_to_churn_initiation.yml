name: Daily Sales to Churn Initiation Cohort

on:
  schedule:
    # Runs at 1:00 AM IST (7:30 PM UTC) every day
    - cron: '30 19 * * *'
  workflow_dispatch: {}   # Allow manual trigger from GitHub UI

jobs:
  run-churn-initiation-query:
    name: Refresh Sales to Churn Initiation table
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run BigQuery query and write to destination table
        run: |
          bq query \
            --project_id=blitzscale-prod-project \
            --use_legacy_sql=false \
            --destination_table=blitzscale-prod-project:nushop.sales_to_churn_initiation_daily \
            --replace \
            --location=asia-south1 \
            "$(cat queries/sales_to_churn_initiation_scheduled.sql)"
