# Paste into https://api.slack.com/apps -> Create New App -> From an app manifest
display_information:
  name: Onboarding Digest
  description: Daily ShopDeck seller-onboarding digest from BigQuery
features:
  bot_user:
    display_name: onboarding-digest
    always_online: true
  slash_commands:
    - command: /digest
      description: Post the onboarding digest for yesterday (IST) in this channel
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
settings:
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
